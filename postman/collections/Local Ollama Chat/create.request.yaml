$kind: http-request
name: Create conversation
order: 4000
method: POST
url: '{{baseUrl}}/api/ai/chat/conversations'
body:
  type: json
  content: |-
    { "title": "Local verification" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Private conversation created',()=>{pm.response.to.have.status(201);pm.collectionVariables.set('conversationId',pm.response.json().id);});
