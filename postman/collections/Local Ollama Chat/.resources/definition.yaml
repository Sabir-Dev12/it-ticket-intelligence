$kind: collection
name: Local Ollama Chat
description: 'JWT-protected chat and persisted history. Supply temporary credentials outside source control. Compatible with the llm-provider simulation using chat-sim.'
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:5080'
  - key: authEmail
    value: ''
  - key: authPassword
    value: ''
  - key: accessToken
    value: ''
  - key: conversationId
    value: ''
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
