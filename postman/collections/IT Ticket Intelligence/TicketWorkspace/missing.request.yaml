$kind: http-request
name: Missing ticket workspace uses ProblemDetails
order: 2000
method: GET
url: '{{baseUrl}}/api/tickets/ffffffff-ffff-4fff-8fff-ffffffffffff/workspace'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('ProblemDetails has trace id', () => { const p=pm.response.json(); pm.expect(p.status).to.eql(404); pm.expect(p.traceId).to.be.a('string'); });
