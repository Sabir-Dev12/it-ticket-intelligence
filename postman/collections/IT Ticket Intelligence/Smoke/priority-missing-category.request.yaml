$kind: http-request
name: Priority category is required
order: 17000
method: POST
url: '{{baseUrl}}/api/predictions/priority'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "title": "Service unavailable", "description": "All users are blocked." }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Omitted category produces ProblemDetails', () => { const p = pm.response.json(); pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'); pm.expect(p.status).to.eql(400); pm.expect(p.errors).to.be.an('object'); pm.expect(p.traceId).to.be.a('string'); });
