$kind: http-request
name: Client cannot override the team threshold
order: 19000
method: POST
url: '{{baseUrl}}/api/predictions/team'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "title": "SQL connection issue", "description": "The service cannot connect.", "threshold": 0 }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Policy override is rejected with ProblemDetails', () => { const p = pm.response.json(); pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'); pm.expect(p.status).to.eql(400); pm.expect(p.errors).to.be.an('object'); pm.expect(p.traceId).to.be.a('string'); });
