$kind: http-request
name: Analyze ticket
order: 2000
method: POST
url: '{{baseUrl}}/api/tickets/{{ticketId}}/analyze'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Aggregate contract and bounded scores', () => { const p = pm.response.json(); pm.expect(Object.keys(p).sort()).to.eql(['category','categoryConfidence','priority','priorityConfidence','recommendedTeam','teamConfidence','needsHumanReview'].sort()); pm.expect(['Hardware','Software','Network','Database','Security','Billing','Account','Application','Other']).to.include(p.category); pm.expect(['Low','Medium','High','Critical']).to.include(p.priority); for (const field of ['categoryConfidence','priorityConfidence','teamConfidence']) { pm.expect(Number.isFinite(p[field])).to.eql(true); pm.expect(p[field]).to.be.within(0,1); } pm.expect(p.needsHumanReview).to.be.a('boolean'); });
      pm.test('Abstention requires review', () => { const p = pm.response.json(); if (p.recommendedTeam === null) pm.expect(p.needsHumanReview).to.eql(true); else pm.expect(['Support','Network','Database','Security','Backend','Infrastructure']).to.include(p.recommendedTeam); pm.collectionVariables.set('analysisResult', JSON.stringify(p)); });
