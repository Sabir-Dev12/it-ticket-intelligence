$kind: http-request
name: MCP rejects a raw SQL argument
order: 4000
method: POST
url: '{{baseUrl}}/mcp'
headers:
  - key: Accept
    value: application/json, text/event-stream
  - key: MCP-Protocol-Version
    value: '2026-07-28'
  - key: Mcp-Method
    value: tools/call
  - key: Mcp-Name
    value: get_system_status
body:
  type: json
  content: '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_system_status","arguments":{"sql":"DROP TABLE app.tickets"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200 tool envelope',()=>pm.response.to.have.status(200));
      pm.test('SQL rejected without execution or echo',()=>{const r=JSON.parse(pm.collectionVariables.get('mcpReply')).result;pm.expect(r.isError).to.eql(true);pm.expect(r.structuredContent.error.code).to.eql('InvalidArguments');pm.expect(JSON.stringify(r)).not.to.include('DROP TABLE');});
