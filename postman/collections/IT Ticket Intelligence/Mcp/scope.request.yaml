$kind: http-request
name: MCP rejects an out-of-scope ticket
order: 3000
method: POST
url: '{{baseUrl}}/mcp'
headers:
  - key: Accept
    value: application/json, text/event-stream
  - key: MCP-Protocol-Version
    value: '2026-07-28'
  - key: Mcp-Method
    value: tools/call
  - key: Mcp-Name
    value: get_ticket
body:
  type: json
  content: '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_ticket","arguments":{"ticketId":"aaaaaaaa-aaaa-4aaa-baaa-aaaaaaaaaaaa"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200 tool envelope',()=>pm.response.to.have.status(200));
      pm.test('Ticket scope enforced before lookup',()=>{const r=JSON.parse(pm.collectionVariables.get('mcpReply')).result;pm.expect(r.isError).to.eql(true);pm.expect(r.structuredContent.error.code).to.eql('Forbidden');pm.expect(r.structuredContent).not.to.have.property('ticket');});
