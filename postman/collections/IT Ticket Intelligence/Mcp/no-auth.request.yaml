$kind: http-request
name: MCP requires authentication
order: 6000
method: POST
url: '{{baseUrl}}/mcp'
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json, text/event-stream
  - key: MCP-Protocol-Version
    value: '2026-07-28'
  - key: Mcp-Method
    value: tools/list
body:
  type: json
  content: '{"jsonrpc":"2.0","id":6,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 401',()=>pm.response.to.have.status(401));
      pm.test('Bearer challenge',()=>pm.expect(pm.response.headers.get('WWW-Authenticate')).to.include('Bearer'));
