$kind: http-request
name: Negotiate authenticated ticket hub
order: 1000
method: POST
url: '{{baseUrl}}/hubs/tickets/negotiate?negotiateVersion=1'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{signalrToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('SignalR transport negotiation without stateful reconnect',()=>{const p=pm.response.json();pm.expect(p.negotiateVersion).to.eql(1);pm.expect(p.connectionToken).to.be.a('string');pm.expect(p.availableTransports.map(t=>t.transport)).to.include('WebSockets');pm.expect(p.useStatefulReconnect===true).to.eql(false);});
