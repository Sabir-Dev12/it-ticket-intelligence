$kind: http-request
name: Retrieve filtered SQL context
order: 8000
method: POST
url: '{{baseUrl}}/api/rag/retrieve'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "question": "SQL Server connection timeout", "limit": 3, "minimumScore": -1, "documentId": "{{ragSqlId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Document filter is applied', () => { const p = pm.response.json(); pm.expect(p.results).to.have.lengthOf(1); pm.expect(p.results[0].documentId).to.eql(pm.collectionVariables.get('ragSqlId')); });
