$kind: http-request
name: Index billing FAQ
order: 6000
method: POST
url: '{{baseUrl}}/api/rag/documents/{{ragBillingId}}/index'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Index queued without waiting for inference',()=>{pm.response.to.have.status(202);const job=pm.response.json();pm.expect(job.state).to.eql('Queued');pm.expect(job.documentId).to.eql(pm.collectionVariables.get('ragBillingId'));pm.collectionVariables.set('ragBillingIdJob',job.id);pm.collectionVariables.set('ragProfile',job.profile);});
      pm.collectionVariables.set('ragPollCount',0);
