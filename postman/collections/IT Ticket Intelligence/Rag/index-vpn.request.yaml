$kind: http-request
name: Index VPN guide
order: 5000
method: POST
url: '{{baseUrl}}/api/rag/documents/{{ragVpnId}}/index'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Index queued without waiting for inference',()=>{pm.response.to.have.status(202);const job=pm.response.json();pm.expect(job.state).to.eql('Queued');pm.expect(job.documentId).to.eql(pm.collectionVariables.get('ragVpnId'));pm.collectionVariables.set('ragVpnIdJob',job.id);pm.collectionVariables.set('ragProfile',job.profile);});
      pm.collectionVariables.set('ragPollCount',0);
