$kind: http-request
name: 'Create ticket'
order: 1000
method: POST
url: '{{baseUrl}}/api/tickets'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Database connection incident",
      "description": "The application cannot reach its database.",
      "createdById": "{{userId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
