$kind: http-request
name: 'Assign team'
order: 6000
method: PATCH
url: '{{baseUrl}}/api/tickets/{{ticketId}}/assignment'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "teamId": "{{teamId}}",
      "revision": {{revision}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
